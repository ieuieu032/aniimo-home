<title>[下書き] Aniimo ホーム配置早見表</title>
<meta name="description" content="Aniimo(アニーモ)のホーム(キャンパー)配置の早見表。Lvごとの植えるもの・施設・加工・アニモ編成。">
<meta name="robots" content="noindex,nofollow">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GP7458ZQ5R"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-GP7458ZQ5R");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>body{background:#F1F5F0}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:#131A16}}:root[data-theme="dark"] body{background:#131A16}</style>
</head>
<body>
<script src="p0.js"></script>
<script src="s1.js"></script>
<script src="s2.js"></script>
<script>
// GA のイベント: 見ている配置(Lv・切り替え)、言語、自分の条件で計算、アニモ編成の操作
(function(){
  const send=(n,p)=>{try{gtag("event",n,p||{});}catch(e){}};
  const st=()=>{try{return state;}catch(e){return null;}};
  let last="";
  function key(S){return [S.lv,S.ev||0,S.rbv||"",S.alt?1:0,S.alt2?1:0,S.dl?1:0,S.nf?1:0,S.cx?1:0].join("|");}
  function onView(){const S=st(); if(!S) return; const k=key(S); if(k===last) return; last=k;
    send("view_layout",{lv:String(S.lv),variant:[S.nf?"通常":"イベント",S.nf?"":"枠"+(S.ev||8),S.rbv||"",S.alt?"alt":"",S.alt2?"alt2":"",S.dl?"デイリー":""].filter(Boolean).join("・"),mode:S.cx?"custom":"recommended",lang:document.documentElement.lang});}
  const v=document.getElementById("view"); if(v){new MutationObserver(onView).observe(v,{childList:true}); onView();}
  document.addEventListener("click",e=>{const t=e.target; if(!t.closest) return; const S=st()||{};
    if(t.closest("#cx-go")) send("custom_calc",{lv:String(S.lv)});
    else if(t.closest("#tm-view [data-xg]")) send("team_exclude",{lv:String(S.lv)});});
  document.addEventListener("change",e=>{const t=e.target; if(t.id==="lang-sel") send("language",{lang:t.value}); else if(t.id==="sp-toggle") send("team_prismana",{on:t.checked?"1":"0"});});
})();
</script>
</body>
</html>
